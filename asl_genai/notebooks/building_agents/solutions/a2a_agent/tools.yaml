# tools.yaml

# --- Data Source ---
kind: source
name: restaurant-db
type: cloud-sql-postgres
project: ${GOOGLE_CLOUD_PROJECT}
region: ${REGION}
instance: ${DB_INSTANCE}
database: ${DB_NAME}
user: postgres
password: ${DB_PASSWORD}

---
# --- Tool 1: Search menu items by category and/or cuisine type ---
kind: tool
name: search-menu
type: postgres-sql
source: restaurant-db
description: >-
  Search for menu items by category and/or cuisine type.
  Use this tool when the user wants to browse menu items
  by category (e.g., Main Course, Appetizer, Dessert) or find dishes
  from a specific cuisine. Both parameters accept an
  empty string to match all values.
statement: |
  SELECT name, cuisine_type, category, ingredients, price, dietary_tags, available
  FROM menu_items
  WHERE ($1 = '' OR LOWER(category) = LOWER($1))
  AND ($2 = '' OR LOWER(cuisine_type) LIKE '%' || LOWER($2) || '%')
  ORDER BY name
  LIMIT 10
parameters:
  - name: category
    type: string
    description: "The menu category to filter by (e.g., 'Main Course', 'Appetizer', 'Dessert'). Use empty string for all categories."
  - name: cuisine_type
    type: string
    description: "A cuisine type to search for (partial match, e.g., 'Italian', 'Japanese'). Use empty string for all cuisines."

---

# --- Tool 2: Get full details for a specific menu item ---
kind: tool
name: get-item-details
type: postgres-sql
source: restaurant-db
description: >-
  Get full details for a specific menu item including its description,
  price, dietary tags, and availability. Use this tool when the
  user asks about a specific dish by name or cuisine.
statement: |
  SELECT name, description, category, cuisine_type, ingredients, price, dietary_tags, available
  FROM menu_items
  WHERE LOWER(name) LIKE '%' || LOWER($1) || '%'
  ORDER BY name
  LIMIT 5
parameters:
  - name: item_name
    type: string
    description: "The name or partial name of the dish to search for."

---

# --- Tool 3: Search menu items by description (semantic search) ---
kind: tool
name: search-menu-by-description
type: postgres-sql
source: restaurant-db
description: >-
  Search menu items using semantic similarity on dish descriptions.
  Use this when the user describes what kind of food they want
  by flavor, texture, dietary needs, or cravings.
statement: |
  SELECT name, description, category, cuisine_type, price, dietary_tags, available
  FROM menu_items
  WHERE description ILIKE '%' || $1 || '%'
  LIMIT 10
parameters:
  - name: description_query
    type: string
    description: "Description or keywords of the dish to search for."
